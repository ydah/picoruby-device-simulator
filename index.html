<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="ハードウェアなしで PicoRuby を試せるブラウザ・マイコンシミュレータ" />
    <link rel="preload" href="/wasm/picoruby/picoruby.wasm" as="fetch" type="application/wasm" crossorigin />
    <title>PicoSim — PicoRuby Device Simulator</title>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="." aria-label="PicoSim ホーム">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 7h18v18H7zM3 11h4m-4 5h4m-4 5h4m18-10h4m-4 5h4m-4 5h4M11 3v4m5-4v4m5-4v4m-10 18v4m5-4v4m5-4v4"/></svg>
        <span>PicoSim</span>
      </a>
      <p>API レベルのシミュレータです。電気特性や厳密なタイミングは再現しません。</p>
    </header>

    <nav class="toolbar" aria-label="実行操作">
      <button id="run" class="primary"><span aria-hidden="true">▶</span> 実行</button>
      <button id="stop"><span aria-hidden="true">■</span> 停止</button>
      <button id="flash"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-9 12h7l-1 8 9-12h-7z"/></svg> 実機へ転送</button>
      <button id="share"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4m-6.8 7 6.8 4"/></svg> 共有</button>
      <label for="speed">速度</label>
      <select id="speed">
        <option value="realtime">リアルタイム</option>
        <option value="fast">×10</option>
        <option value="step">ステップ</option>
      </select>
      <button id="step" disabled>次のイベント</button>
      <span id="runtime-status" class="status" role="status">準備中</span>
    </nav>

    <main>
      <section class="panel editor-panel" aria-labelledby="editor-title">
        <div class="panel-heading"><h1 id="editor-title">main.rb</h1><span>PicoRuby 4</span></div>
        <div id="editor"></div>
      </section>

      <section class="panel board-panel" aria-labelledby="board-title">
        <div class="panel-heading"><h2 id="board-title">ボード</h2><span id="board-name">pico_w</span></div>
        <canvas id="board" width="640" height="330" aria-label="配線済みの Pico ボードと接続部品"></canvas>
        <div id="device-controls" class="device-controls"></div>
      </section>

      <section class="panel console-panel" aria-labelledby="console-title">
        <div class="panel-heading">
          <h2 id="console-title">シリアル出力</h2>
          <button id="clear-console" class="text-button">消去</button>
        </div>
        <pre id="console" aria-live="polite"></pre>
      </section>

      <section class="panel waveform-panel" aria-labelledby="waveform-title">
        <div class="panel-heading"><h2 id="waveform-title">ピン波形</h2><span>直近 5 秒</span></div>
        <canvas id="waveform" width="640" height="190" aria-label="GPIO のデジタル波形"></canvas>
        <p id="waveform-summary" class="sr-only"></p>
      </section>

      <aside class="panel config-panel" aria-labelledby="config-title">
        <div class="panel-heading"><h2 id="config-title">board.yml</h2><span>配線定義</span></div>
        <textarea id="board-source" spellcheck="false" aria-label="board.yml の内容"></textarea>
        <button id="apply-board">配線を適用</button>
        <div id="warnings" role="alert"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
